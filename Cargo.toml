[package]
name = "tabby-alt-sync"
version = "0.1.0"
edition = "2021"
description = "Minimal single-user config sync host for Tabby"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
form_urlencoded = "1.2.2"
http-body-util = "0.1.5"
hex = "0.4.3"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
regex = "1.13.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
